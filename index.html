<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    
    <!-- 1. Viewport meta-тег — сразу после charset, до title -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Мой Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            
            /* 3. Flexbox для body */
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
        }

        /* 2. Стили для input */
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
        }

        /* 4. Media query — в самом конце style, после всех обычных правил */
        @media (max-width: 400px) {
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <h1>Привет из Mini App!</h1>
    <p id="user-info">Загрузка...</p>
    <input type="text" id="my-input" placeholder="Введи что-нибудь">

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const rawData = params.get("data");

            expenses = parsed.expenses;

        }

            "initDataUnsafe: " + JSON.stringify(tg.initDataUnsafe) + 
            " | initData length: " + tg.initData.length;

            document.getElementById("user-info").innerText = "Не в Telegram — данных о пользователе нет";
        }

        tg.MainButton.setText("Отправить данные боту");
        tg.MainButton.show();
        tg.MainButton.onClick(function() {
            let value = document.getElementById("my-input").value;
            tg.sendData(value);
        });*/
    </script>
</body>
</html>
