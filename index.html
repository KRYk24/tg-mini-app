<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мой Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Привет из Mini App!</h1>
    <p id="user-info">Загрузка...</p>
    <input type="text" id="my-input" placeholder="Введи что-нибудь">

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        console.log("Цвета темы:", tg.themeParams);
        
        let user = tg.initDataUnsafe.user;

        if (user) {
            document.getElementById("user-info").innerText = "Привет, " + user.first_name + "!";
        } else {
            document.getElementById("user-info").innerText = "Не в Telegram — данных о пользователе нет";
        }

        tg.MainButton.setText("Отправить данные боту");
        tg.MainButton.show();
        tg.MainButton.onClick(function() {
            let value = document.getElementById("my-input").value;
            tg.sendData(value);
        });
    </script>
</body>
</html>
