<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <h1>Привет из Mini App!</h1>
    <p id="user-info">Загрузка...</p>
    <input type="text" id="my-input" placeholder="Введи что-нибудь">

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // ВРЕМЕННАЯ ДИАГНОСТИКА — выводим сырые данные прямо на страницу
        document.getElementById("user-info").innerText = 
            "initDataUnsafe: " + JSON.stringify(tg.initDataUnsafe) + 
            " | initData length: " + tg.initData.length;

        /* Обычный код, временно закомментирован:
        let user = tg.initDataUnsafe.user;

        if (user) {
            document.getElementById("user-info").innerText = "Привет, " + user.first_name + "!";
        } else {
            document.getElementById("user-info").innerText = "Не в Telegram — данных о пользователе нет";
        }
        */

        tg.MainButton.setText("Отправить данные боту");
        tg.MainButton.show();
        tg.MainButton.onClick(function() {
            let value = document.getElementById("my-input").value;
            tg.sendData(value);
        });
    </script>
</body>
</html>
