<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Крестики-нолики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D12;
    --surface: #14171F;
    --surface-2: #1B1F2A;
    --line: #262B38;
    --text: #E7E9EE;
    --muted: #8B93A7;
    --x-color: #7C5CFF;
    --x-glow: rgba(124, 92, 255, 0.45);
    --o-color: #22D3B8;
    --o-glow: rgba(34, 211, 184, 0.45);
    --danger: #FF6B6B;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 20px 32px;
  }

  .header {
    width: 100%;
    max-width: 400px;
    text-align: center;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }

  h1 .x { color: var(--x-color); }
  h1 .o { color: var(--o-color); }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }

  .status-bar {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-family: 'Space Grotesk', sans-serif;
  }

  .score {
    display: flex;
    gap: 18px;
    font-size: 14px;
  }

  .score-item { display: flex; align-items: center; gap: 6px; }

  .score-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .score-dot.x { background: var(--x-color); }
  .score-dot.o { background: var(--o-color); }
  .score-dot.d { background: var(--muted); }

  .status-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: color 0.25s ease;
    min-height: 18px;
  }

  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 360px;
    aspect-ratio: 1;
  }

  .board {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 10px;
  }

  .cell {
    background: var(--surface-2);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .cell:active { transform: scale(0.96); }
  .cell.disabled { cursor: default; }
  .cell.hint { background: #202535; }

  .cell svg {
    width: 52%;
    height: 52%;
    overflow: visible;
  }

  .mark-path {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 9;
    stroke-dasharray: 140;
    stroke-dashoffset: 140;
    animation: draw 0.28s ease forwards;
  }

  .mark-x { stroke: var(--x-color); filter: drop-shadow(0 0 6px var(--x-glow)); }
  .mark-o { stroke: var(--o-color); filter: drop-shadow(0 0 6px var(--o-glow)); }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  .win-line {
    position: absolute;
    inset: 10px;
    pointer-events: none;
    overflow: visible;
  }

  .win-line path {
    fill: none;
    stroke-linecap: round;
    stroke-width: 7;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: drawline 0.4s ease forwards;
  }

  @keyframes drawline {
    to { stroke-dashoffset: 0; }
  }

  .controls {
    width: 100%;
    max-width: 360px;
    margin-top: 22px;
    display: flex;
    gap: 10px;
  }

  button.action {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 13px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  button.action:active { background: var(--surface-2); }

  button.action.primary {
    background: var(--x-color);
    border-color: var(--x-color);
    color: #fff;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <div class="header">
    <h1><span class="x">Крестики</span> &amp; <span class="o">нолики</span></h1>
    <p class="subtitle">Один игрок · соперник играет безошибочно</p>
  </div>

  <div class="status-bar">
    <div class="score">
      <div class="score-item"><span class="score-dot x"></span><span id="scoreX">0</span></div>
      <div class="score-item"><span class="score-dot o"></span><span id="scoreO">0</span></div>
      <div class="score-item"><span class="score-dot d"></span><span id="scoreD">0</span></div>
    </div>
    <div class="status-text" id="statusText">Ваш ход</div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <svg class="win-line" id="winLine" viewBox="0 0 340 340"></svg>
  </div>

  <div class="controls">
    <button class="action primary" id="newGameBtn">Новая игра</button>
    <button class="action" id="resetScoreBtn">Сбросить счёт</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#0B0D12');
    tg.setBackgroundColor('#0B0D12');
  }

  const HUMAN = 'X';
  const BOT = 'O';
  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let gameOver = false;
  let scores = { X: 0, O: 0, D: 0 };

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('statusText');
  const winLineEl = document.getElementById('winLine');
  const toastEl = document.getElementById('toast');

  const cellCenters = [
    [56,56],[170,56],[284,56],
    [56,170],[170,170],[284,170],
    [56,284],[170,284],[284,284]
  ];

  function buildBoard() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', () => onCellClick(i));
      boardEl.appendChild(cell);
    }
  }

  function markSVG(player) {
    if (player === HUMAN) {
      return `<svg viewBox="0 0 100 100">
        <path class="mark-path mark-x" d="M20,20 L80,80"/>
        <path class="mark-path mark-x" d="M80,20 L20,80" style="animation-delay:0.05s"/>
      </svg>`;
    }
    return `<svg viewBox="0 0 100 100">
      <circle class="mark-path mark-o" cx="50" cy="50" r="32"/>
    </svg>`;
  }

  function render() {
    const cells = boardEl.children;
    for (let i = 0; i < 9; i++) {
      const cell = cells[i];
      if (board[i]) {
        cell.innerHTML = markSVG(board[i]);
        cell.classList.add('disabled');
      } else {
        cell.innerHTML = '';
        cell.classList.remove('disabled');
      }
    }
  }

  function checkWinner(b) {
    for (const line of WIN_LINES) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) {
        return { winner: b[a], line };
      }
    }
    if (b.every(v => v)) return { winner: 'draw', line: null };
    return null;
  }

  function minimax(b, depth, isMaximizing) {
    const result = checkWinner(b);
    if (result) {
      if (result.winner === BOT) return 10 - depth;
      if (result.winner === HUMAN) return depth - 10;
      return 0;
    }

    if (isMaximizing) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = BOT;
          best = Math.max(best, minimax(b, depth + 1, false));
          b[i] = null;
        }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = HUMAN;
          best = Math.min(best, minimax(b, depth + 1, true));
          b[i] = null;
        }
      }
      return best;
    }
  }

  function bestMove() {
    let bestScore = -Infinity;
    let move = null;
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        board[i] = BOT;
        const score = minimax(board, 0, false);
        board[i] = null;
        if (score > bestScore) {
          bestScore = score;
          move = i;
        }
      }
    }
    return move;
  }

  function onCellClick(i) {
    if (gameOver || board[i]) return;
    board[i] = HUMAN;
    render();

    const result = checkWinner(board);
    if (result) {
      finishGame(result);
      return;
    }

    setStatus('Соперник думает…');
    setBoardLocked(true);

    setTimeout(() => {
      const move = bestMove();
      if (move !== null) {
        board[move] = BOT;
        render();
      }
      const result2 = checkWinner(board);
      if (result2) {
        finishGame(result2);
      } else {
        setBoardLocked(false);
        setStatus('Ваш ход');
      }
    }, 380);
  }

  function setBoardLocked(locked) {
    const cells = boardEl.children;
    for (let i = 0; i < 9; i++) {
      if (!board[i]) {
        cells[i].classList.toggle('disabled', locked);
      }
    }
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function drawWinLine(line) {
    if (!line) return;
    const [a, , c] = line;
    const [x1, y1] = cellCenters[a];
    const [x2, y2] = cellCenters[c];
    const color = board[a] === HUMAN ? 'var(--x-color)' : 'var(--o-color)';
    winLineEl.innerHTML = `<path d="M${x1},${y1} L${x2},${y2}" stroke="${color}" style="filter: drop-shadow(0 0 6px ${board[a] === HUMAN ? 'var(--x-glow)' : 'var(--o-glow)'})"/>`;
  }

  function finishGame(result) {
    gameOver = true;
    setBoardLocked(true);

    if (result.winner === 'draw') {
      scores.D++;
      setStatus('Ничья');
      showToast('Ничья! Никто не смог найти брешь.');
    } else {
      drawWinLine(result.line);
      if (result.winner === HUMAN) {
        scores.X++;
        setStatus('Вы победили!');
        showToast('Победа! Такое бывает редко 🎉');
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } else {
        scores.O++;
        setStatus('Соперник победил');
        showToast('На этот раз не получилось — попробуйте снова.');
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      }
    }
    updateScoreboard();
  }

  function updateScoreboard() {
    document.getElementById('scoreX').textContent = scores.X;
    document.getElementById('scoreO').textContent = scores.O;
    document.getElementById('scoreD').textContent = scores.D;
  }

  let toastTimer = null;
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  function newGame() {
    board = Array(9).fill(null);
    gameOver = false;
    winLineEl.innerHTML = '';
    setStatus('Ваш ход');
    buildBoard();
    render();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  }

  document.getElementById('newGameBtn').addEventListener('click', newGame);
  document.getElementById('resetScoreBtn').addEventListener('click', () => {
    scores = { X: 0, O: 0, D: 0 };
    updateScoreboard();
    showToast('Счёт сброшен');
  });

  buildBoard();
  render();
})();
</script>
</body>
</html>
